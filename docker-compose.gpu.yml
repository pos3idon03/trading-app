# Optional GPU override for NVIDIA hosts.
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Requires NVIDIA Container Toolkit and DOCKER_TORCH_CUDA=cu128 (or cu128-nightly) in .env at build time for RTX 50-series.

services:
  tiingo_worker_heavy:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tiingo_backend:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
